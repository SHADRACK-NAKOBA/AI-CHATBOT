<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.execute-api.us-east-1.amazonaws.com https://*.cloudfront.net; img-src 'self' data:; frame-ancestors 'none'; form-action 'self';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <title>Nakoba AI Assistant</title>
    <style>
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface2: #22263a;
        --border: #2e3350;
        --accent: #4f8ef7;
        --accent-dim: #1e3a6e;
        --text: #e8eaf0;
        --text-muted: #7a80a0;
        --user-bg: #1e3a6e;
        --bot-bg: #1a1d27;
        --radius: 14px;
        --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #app {
        width: 100%;
        max-width: 760px;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      /* ── Header ── */
      header {
        padding: 18px 24px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      .logo {
        width: 36px;
        height: 36px;
        background: var(--accent);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      header h1 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      header p {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 1px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        background: #3ecf6a;
        border-radius: 50%;
        margin-left: auto;
        box-shadow: 0 0 8px #3ecf6a88;
      }

      /* ── Messages ── */
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scroll-behavior: smooth;
      }

      #messages::-webkit-scrollbar {
        width: 4px;
      }
      #messages::-webkit-scrollbar-track {
        background: transparent;
      }
      #messages::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      .msg {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        animation: fadeUp 0.2s ease both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .msg.user {
        flex-direction: row-reverse;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 600;
      }

      .msg.user .avatar {
        background: var(--accent);
        color: #fff;
      }

      .msg.bot .avatar {
        background: var(--surface2);
        border: 1px solid var(--border);
      }

      .bubble {
        max-width: 78%;
        padding: 12px 16px;
        border-radius: var(--radius);
        font-size: 14px;
        line-height: 1.65;
      }

      .msg.user .bubble {
        background: var(--user-bg);
        border: 1px solid #2a4a8a;
        border-bottom-right-radius: 4px;
      }

      .msg.bot .bubble {
        background: var(--bot-bg);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }

      /* ── Typing indicator ── */
      .typing-dots {
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 4px 0;
      }

      .typing-dots span {
        width: 7px;
        height: 7px;
        background: var(--text-muted);
        border-radius: 50%;
        animation: dot 1.2s infinite;
      }

      .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes dot {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      /* ── Empty state ── */
      #empty {
        text-align: center;
        margin: auto;
        padding: 40px 20px;
      }

      #empty .icon {
        font-size: 40px;
        margin-bottom: 16px;
      }

      #empty h2 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      #empty p {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.6;
        max-width: 320px;
        margin: 0 auto 24px;
      }

      .starters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        max-width: 400px;
        margin: 0 auto;
      }

      .starter {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        color: var(--text-muted);
        cursor: pointer;
        text-align: left;
        transition: border-color 0.15s, color 0.15s;
      }

      .starter:hover {
        border-color: var(--accent);
        color: var(--text);
      }

      /* ── Input area ── */
      #input-area {
        padding: 16px 20px 20px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }

      .input-row {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 12px;
        transition: border-color 0.15s;
      }

      .input-row:focus-within {
        border-color: var(--accent);
      }

      #msgInput {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 14px;
        font-family: var(--font);
        resize: none;
        line-height: 1.5;
        max-height: 140px;
        overflow-y: auto;
      }

      #msgInput::placeholder {
        color: var(--text-muted);
      }

      #sendBtn {
        width: 34px;
        height: 34px;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: opacity 0.15s, transform 0.1s;
      }

      #sendBtn:hover {
        opacity: 0.85;
      }

      #sendBtn:active {
        transform: scale(0.94);
      }

      #sendBtn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      #sendBtn svg {
        width: 16px;
        height: 16px;
        fill: white;
      }

      .hint {
        font-size: 11px;
        color: var(--text-muted);
        text-align: center;
        margin-top: 10px;
      }

      /* ── Error toast ── */
      #toast {
        position: fixed;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #5c1a1a;
        border: 1px solid #8b2929;
        color: #ffaaaa;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        pointer-events: none;
        white-space: nowrap;
      }

      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>

  <body>
    <div id="app">
      <header>
        <div class="logo">🤖</div>
        <div>
          <h1>AI Assistant</h1>
          <p>Powered by Claude</p>
        </div>
        <div class="status-dot" title="Online"></div>
      </header>

      <div id="messages">
        <div id="empty">
          <div class="icon">✨</div>
          <h2>How can I help you today?</h2>
          <p>Ask me anything — I'm powered by Claude and ready to assist.</p>
          <div class="starters">
            <button
              class="starter"
              onclick="sendStarter('Explain how AWS Lambda works')"
            >
              Explain AWS Lambda
            </button>
            <button
              class="starter"
              onclick="sendStarter('What is serverless architecture?')"
            >
              Serverless architecture
            </button>
            <button
              class="starter"
              onclick="sendStarter('Write me a Python hello world')"
            >
              Write some code
            </button>
            <button
              class="starter"
              onclick="sendStarter('What are the benefits of using S3 for static hosting?')"
            >
              S3 static hosting
            </button>
          </div>
        </div>
      </div>

      <div id="input-area">
        <div class="input-row">
          <textarea
            id="msgInput"
            rows="1"
            placeholder="Message AI Assistant..."
          ></textarea>
          <button id="sendBtn" onclick="sendMessage()" title="Send">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" />
            </svg>
          </button>
        </div>
        <p class="hint">Press Enter to send · Shift+Enter for new line · Powered by Claude (Anthropic AI)</p>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      // ── CONFIG ──────────────────────────────────────────────────────────────
      // Injected by CI/CD pipeline — do not hardcode API Gateway URLs here
      const API_URL = "YOUR_API_GATEWAY_URL/chat";
      const MAX_HISTORY = 20;
      const MAX_RETRIES = 2;
      // ────────────────────────────────────────────────────────────────────────

      const messagesEl = document.getElementById("messages");
      const inputEl = document.getElementById("msgInput");
      const sendBtn = document.getElementById("sendBtn");
      const emptyEl = document.getElementById("empty");
      const toastEl = document.getElementById("toast");

      let history = [];
      let isLoading = false;
      let pendingRequest = null;

      // Auto-resize textarea
      inputEl.addEventListener("input", () => {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
      });

      // Enter to send, Shift+Enter for newline
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      function sendStarter(text) {
        inputEl.value = text;
        sendMessage();
      }

      function appendMessage(role, content) {
        emptyEl.style.display = "none";

        const msg = document.createElement("div");
        msg.className = `msg ${role}`;

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "user" ? "U" : "🤖";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = content;

        msg.appendChild(avatar);
        msg.appendChild(bubble);
        messagesEl.appendChild(msg);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return bubble;
      }

      function showTyping() {
        const msg = document.createElement("div");
        msg.className = "msg bot";
        msg.id = "typing";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "🤖";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML =
          '<div class="typing-dots"><span></span><span></span><span></span></div>';

        msg.appendChild(avatar);
        msg.appendChild(bubble);
        messagesEl.appendChild(msg);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function removeTyping() {
        document.getElementById("typing")?.remove();
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        setTimeout(() => toastEl.classList.remove("show"), 3500);
      }

      async function fetchWithRetry(url, options, retries = MAX_RETRIES) {
        for (let attempt = 0; attempt <= retries; attempt++) {
          try {
            const res = await fetch(url, options);
            if (res.status === 429) {
              const delay = Math.min(1000 * Math.pow(2, attempt), 8000);
              await new Promise((r) => setTimeout(r, delay));
              continue;
            }
            return res;
          } catch (err) {
            if (attempt === retries) throw err;
            await new Promise((r) => setTimeout(r, 500 * (attempt + 1)));
          }
        }
      }

      async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text || isLoading) return;

        // Prevent duplicate sends
        if (pendingRequest) return;

        isLoading = true;
        sendBtn.disabled = true;
        inputEl.value = "";
        inputEl.style.height = "auto";

        appendMessage("user", text);
        showTyping();

        const controller = new AbortController();
        pendingRequest = controller;

        try {
          const res = await fetchWithRetry(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, history }),
            signal: controller.signal,
          });

          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            if (res.status === 429) throw new Error("Rate limit reached. Please wait a moment.");
            if (res.status === 400) throw new Error(err.error || "Invalid request.");
            throw new Error(`Server error (${res.status}). Please try again.`);
          }

          const data = await res.json();
          removeTyping();

          if (data.error) throw new Error(data.error);

          const reply = data.response || data.reply;
          appendMessage("bot", reply);
          history.push({ role: "user", content: text });
          history.push({ role: "assistant", content: reply });

          if (history.length > MAX_HISTORY) history = history.slice(-MAX_HISTORY);
        } catch (err) {
          removeTyping();
          if (err.name !== "AbortError") {
            showToast(err.message || "Failed to send. Please try again.");
          }
        } finally {
          pendingRequest = null;
          isLoading = false;
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }
    </script>
  </body>
</html>

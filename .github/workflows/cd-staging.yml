name: CD — Deploy to Staging

on:
  push:
    branches: [main]

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    # Opt-in: set the repository VARIABLE ENABLE_CD=true once AWS secrets are configured (see docs/07-ci-cd.md).
    # Without it, forks/clones don't get failing deployments on every push.
    if: ${{ vars.ENABLE_CD == 'true' }}
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Lambda dependencies (production only)
        working-directory: ai-chatbot/lambda
        run: npm install --omit=dev

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=nakoba-chatbot/staging/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -var-file="environments/staging.tfvars" -out=staging.plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve staging.plan

      - name: Get deployment outputs
        working-directory: terraform
        id: tf_outputs
        run: |
          echo "cloudfront_domain=$(terraform output -raw cloudfront_domain)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "api_url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf_outputs.outputs.cloudfront_id }} \
            --paths "/*"

      - name: Smoke test staging
        run: |
          CLOUDFRONT_DOMAIN="${{ steps.tf_outputs.outputs.cloudfront_domain }}"

          echo "Waiting 30s for CloudFront propagation..."
          sleep 30

          # Health check
          HEALTH=$(curl -sf "${CLOUDFRONT_DOMAIN}/health")
          echo "Health response: $HEALTH"
          echo "$HEALTH" | grep -q '"status":"healthy"' || (echo "Health check failed" && exit 1)

          # Chat endpoint test
          CHAT=$(curl -sf -X POST "${CLOUDFRONT_DOMAIN}/chat" \
            -H "Content-Type: application/json" \
            -d '{"message":"Say OK in one word"}')
          echo "Chat response: $CHAT"
          echo "$CHAT" | grep -q '"response"' || (echo "Chat endpoint failed" && exit 1)

          echo "Staging smoke tests passed"

      - name: Report staging URL
        run: echo "Staging deployed at ${{ steps.tf_outputs.outputs.cloudfront_domain }}"
